# =============================================================================
# Debezium Server — capture des nouvelles activités (CDC) et envoi dans Redpanda
#
# Source : table app.public.activites (PostgreSQL)
# Sink   : topic Redpanda "app.public.activites"
# Le mot de passe n'est pas ici : il est passé par la variable d'environnement
# DEBEZIUM_SOURCE_DATABASE_PASSWORD (voir docker-compose.yml).
# =============================================================================

# ---------- Sink : Redpanda (compatible Kafka) ----------
debezium.sink.type=kafka
debezium.sink.kafka.producer.bootstrap.servers=redpanda:9092
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# ---------- Source : PostgreSQL ----------
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=debezium
debezium.source.database.dbname=app

# Préfixe des topics -> le topic s'appellera app.public.activites
debezium.source.topic.prefix=app
debezium.source.table.include.list=public.activites

# Réplication logique native de Postgres (plugin pgoutput).
# La publication est créée par le script d'init : Debezium n'a pas le droit de la créer.
debezium.source.plugin.name=pgoutput
debezium.source.publication.name=dbz_activites
debezium.source.publication.autocreate.mode=disabled
debezium.source.slot.name=dbz_activites

# Au premier démarrage, Debezium envoie aussi les lignes déjà présentes (snapshot).
# Ainsi l'entrepôt reçoit tout l'historique, quel que soit l'ordre de démarrage.
# Le consommateur Slack filtrera pour ne publier que les activités "live".
debezium.source.snapshot.mode=initial

# Mémorise la position de lecture dans un fichier (volume Docker),
# pour reprendre là où il s'était arrêté après un redémarrage.
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=0

# ---------- Format des messages ----------
# JSON simple (sans le schéma Kafka Connect embarqué dans chaque message)
debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false

# Aplatit le message : on reçoit directement la ligne insérée
# + le type d'opération (__op : r = snapshot, c = insertion)
debezium.transforms=unwrap
debezium.transforms.unwrap.type=io.debezium.transforms.ExtractNewRecordState
debezium.transforms.unwrap.add.fields=op,source.ts_ms

# ---------- Logs ----------
quarkus.log.level=INFO
quarkus.log.console.json=false
