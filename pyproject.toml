[project]
name = "projet12"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AxelFB1992", email = "faurebeaulieu.axel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faker>=40.40.0",
    "googlemaps>=4.10.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "slack-sdk>=3.45.0",
    "sqlalchemy>=2.1.3",
]

[project.scripts]
projet12 = "projet12:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
