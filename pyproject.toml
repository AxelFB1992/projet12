[project]
name = "projet12"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AxelFB1992", email = "faurebeaulieu.axel@gmail.com" }
]
requires-python = ">=3.12"

# Socle commun : tout ce dont les consommateurs temps réel ont besoin (image Docker)
dependencies = [
    "psycopg[binary]",
    "python-dotenv",
    "confluent-kafka>=2.16.0",
    "httpx>=0.28.1",
]

# Les dépendances complètes, avant de structurer les consommateurs sous forme de conteneurs avec le même uv.lock que pour le projet
# Par conséquent, il était nécessaire de séparer les dépendances pour ne pas tout exporter dans les conteneurs des consommateurs
#dependencies = [
#    "confluent-kafka>=2.16.0",
#    "dbt-postgres>=1.11.0",
#    "faker>=40.40.0",
#    "googlemaps>=4.10.0",
#    "httpx>=0.28.1",
#    "matplotlib>=3.11.2",
#    "openpyxl>=3.1.5",
#    "pandas>=3.0.6",
#    "psycopg[binary]>=3.3.6",
#    "python-dotenv>=1.2.4",
#    "setuptools>=84.0.0",
#    "slack-sdk>=3.45.0",
#    "soda-core-postgres>=3.5.6",
#    "sqlalchemy>=2.1.3",
#]


[project.scripts]
projet12 = "projet12:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
# Tout ce que l'on a supprimé dans le socle commun de dépendances (dependencies), on le place ici dans batch
# Ces dépendances serviront pour les autres applications (soda, dbt), pas pour les consommateurs qui n'en ont pas besoin
batch = [
    "pandas",
    "openpyxl",
    "matplotlib>=3.11.2",
    "dbt-postgres>=1.11.0",
    "soda-core-postgres>=3.5.6",
    "setuptools>=84.0.0",
]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
# "uv sync" / "uv run" installent le socle + batch + dev, comme avant.
# L'image des consommateurs installe le socle seul (--no-default-groups).
default-groups = ["batch", "dev"]
