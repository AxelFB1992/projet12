name: projet12

services:
  postgres:
    image: postgres:16-alpine
    container_name: p12-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      # Mots de passe des rôles applicatifs, lus par le script d'init
      APP_WRITER_PASSWORD: ${APP_WRITER_PASSWORD}
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD}
      ETL_PASSWORD: ${ETL_PASSWORD}
      POWERBI_PASSWORD: ${POWERBI_PASSWORD}
      KESTRA_DB_PASSWORD: ${KESTRA_DB_PASSWORD}
    # wal_level=logical : indispensable pour que Debezium lise les changements
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    ports:
      # Exposé uniquement en local (pas sur le réseau) — Power BI s'y connecte
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

volumes:
  pgdata:
