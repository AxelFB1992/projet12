name: projet12

services:
  postgres:
    image: postgres:16-alpine
    # Nom du conteneur que l'on veut voir apparaitre dans docker ps
    container_name: p12-postgres
    restart: unless-stopped
    environment:
      # On re-utilise des variables d'environnement pour éviter que les clés soient écrit en dur dans le docker-compose
      # Nom et mot de passe pour le super-utilisateur ainsi que le nom de la base de données principale (postgres)
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      # Mots de passe des rôles applicatifs, lus par le script d'initialisation, executé dans le conteneur postgres
      # En effet, tous les mots de passe qu'il y a ici servent aux rôles postgres, d'où leur présence dans cette section.
      APP_WRITER_PASSWORD: ${APP_WRITER_PASSWORD}
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD}
      ETL_PASSWORD: ${ETL_PASSWORD}
      POWERBI_PASSWORD: ${POWERBI_PASSWORD}
      KESTRA_DB_PASSWORD: ${KESTRA_DB_PASSWORD}
      SLACK_DB_PASSWORD: ${SLACK_DB_PASSWORD}
    # Les commandes que docker va passer en paramètre à psql après son lancement
    # wal_level=logical : indispensable pour que Debezium lise les changements
    # Plutôt que de lancer seulement 'postgres' à l'intérieur du conteneur docker, on va lancer 'postgres' avec des arguments
    command:
      - postgres
      - -c
      # Journal des transactions : le niveau 'logical' permet d'afficher toutes les modifications logiques (pas que physiques)
      - wal_level=logical
      - -c
      # Slot de réplication
      - max_replication_slots=4
      - -c
      # Nombre de connexions de réplication simultanés
      - max_wal_senders=4
    ports:
      # Exposé uniquement en local (pas sur le réseau) — Power BI s'y connecte
      # Format IP_hôte:port_hôte:port_conteneur -> ${POSTGRES_PORT:-5432} de ma machine local reidrige vers le port 5432 du conteneur 
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Volume géré par docker, il permet de stocker durablement les fichiers de la base postgres
      - pgdata:/var/lib/postgresql/data
      # Montage de dossier qui permet d'executer les script de init au premier démarrage --> on le renomme donc en entrypoint
      # Le montage de dossier permet une correspondance (lien direct) entre un dossier de la machine local et un dossier du conteneur
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      # Commande executé par docker régulièrement pour savoir si le système est réellement "healthy" au sens de la commande ci-dessous
      # Sans cette commande, les conditions "depends_on: condition: service_healthy" attendraient simplemenet que le service soit lancé
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Limite de mémoire RAM allooué en service (en général, les réglages internes sont déjà en dessous de ces limites)
    mem_limit: 512m

  # ---------------------------------------------------------------------------
  # Redpanda : broker de messages compatible Kafka (1 nœud, mode dev, bridé)
  # ---------------------------------------------------------------------------
  redpanda:
    image: redpandadata/redpanda:v24.3.1
    container_name: p12-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      # internal = adresse pour les conteneurs ; external = adresse pour ta machine
      # C'est à dire que redpanda peut écouter les topics qui transitent à l'exterieur de son conteneur mais seulement sur le port 19092
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      # Permet de donner aux services clients (client Kakfa) qui voudraient se connecter et écouter les topics une interface d'accès
      # Par conséquent, les conteneurs du même environnment (projet12) utilisent redpanda:9092 et les services externent localhost:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      # Communications entre noeuds (brokers) RedPanda : inutile ici car il n'y a qu'un seul noeud
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      # dev-container : réglages de développement (création auto des topics...)
      - --mode=dev-container
      # Un seul coeur CPU qui gère le service RedPanda
      - --smp=1
      # La RAM reservé par RedPanda, plus restrictive que la limite fixée ci-dessous
      - --memory=768M
      # 0 Megaoctet de RAM supplémentaire
      - --reserve-memory=0M
      # Le niveau des logs n'est pas positionné à Info mais à Warning pour limiter le nombre de logs
      - --default-log-level=warn
    ports:
    # Format IP_hôte:port_hôte:port_conteneur -> le port 19092 de ma machine local reidrige vers le port 19092 du conteneur
      - "127.0.0.1:19092:19092"   # accès Kafka depuis ta machine (scripts Python lancés hors Docker)
    volumes:
      # Volume géré par docker permettant la persistance des topics, messages et position de lecture des groupes de consommateurs
      - redpanda_data:/var/lib/redpanda/data
      # Commande executé par docker régulièrement pour savoir si le système est réellement "healthy" au sens de la commande ci-dessous
      # Sans cette commande, les conditions "depends_on: condition: service_healthy" attendraient simplemenet que le service soit lancé
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Limite de mémoire RAM allooué en service (en général, les réglages internes sont déjà en dessous de ces limites)
    mem_limit: 1g

  # ---------------------------------------------------------------------------
  # Redpanda Console : interface web (topics, messages, retard des consommateurs)
  # ---------------------------------------------------------------------------
  redpanda-console:
    image: redpandadata/console:v2.8.0
    container_name: p12-redpanda-console
    restart: unless-stopped
    # redpdanda_console a besoin de redpanda pour exister, par conséquent on le resneigne comme KAFKA_BROKERS dans l'environnement
    environment:
      KAFKA_BROKERS: redpanda:9092
    # Format IP_hôte:port_hôte:port_conteneur -> le port 8085 de ma machine local reidrige vers le port 8080 du conteneur
    ports:
      - "127.0.0.1:8085:8080"     # http://localhost:8085
    # Pour que redpanda_console puisse s'executer, il faut que le vrai service redpanda soit lancé, ce qui est normal
    depends_on:
      redpanda:
        condition: service_healthy
    # Limite de mémoire RAM allooué en service (en général, les réglages internes sont déjà en dessous de ces limites)
    mem_limit: 256m


  # ---------------------------------------------------------------------------
  # Redpanda Init : Crée le topic app.public.activites avant la génération de messages
  # ---------------------------------------------------------------------------  
  # Crée le topic dès le démarrage (avant tout message), pour que le consommateur
  # Slack (auto.offset.reset = latest) s'y positionne tout de suite et n'en saute
  # aucun. Ne fait rien si le topic existe déjà.
  redpanda-init:
    image: redpandadata/redpanda:v24.3.1
    container_name: p12-redpanda-init
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        rpk topic describe app.public.activites -X brokers=redpanda:9092 > /dev/null 2>&1
        || rpk topic create app.public.activites -p 1 -r 1 -X brokers=redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    mem_limit: 128m

  # ---------------------------------------------------------------------------
  # Debezium Server : lit le journal Postgres (CDC) et publie dans Redpanda
  # ---------------------------------------------------------------------------
  # Debezium est une application Java et Quarkus est un framework java
  debezium:
    image: quay.io/debezium/server:3.0.0.Final
    container_name: p12-debezium
    restart: unless-stopped
    environment:
      # Secret injecté par variable d'environnement (Quarkus la mappe sur
      # la propriété debezium.source.database.password)
      DEBEZIUM_SOURCE_DATABASE_PASSWORD: ${DEBEZIUM_PASSWORD}
      # Cet option fixe la mémoire maximale de la JVM
      JAVA_TOOL_OPTIONS: -Xmx384m
    volumes:
      # Montage de dossier permettant de faire comme si ./docker/debezium/ était /debezium/config/ pour le lancement du conteneur Debezium
      - ./docker/debezium/application.properties:/debezium/config/application.properties:ro
      # # Volume géré par docker permettant de sauvegarder la position à laquelle il s'est arrêter dans la lecture de la base de données
      - debezium_data:/debezium/data   # position de lecture (offsets)
    # Pour que debezium se lance, il faut que les deux services avec lesquels ils discutent soient lancé, à savoir redpanda et postgres
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    # Limite de mémoire RAM allooué en service (en général, les réglages internes sont déjà en dessous de ces limites)
    mem_limit: 640m

  # ---------------------------------------------------------------------------
  # Kestra : orchestration du pipeline batch (ingestion, geo, dbt, Soda)
  # Image Kestra + uv (docker/kestra/Dockerfile). Base interne : Postgres "kestra".
  # ---------------------------------------------------------------------------
  kestra:
    build: ./docker/kestra
    image: projet12-kestra
    container_name: p12-kestra
    restart: unless-stopped
    user: root
    # Cette commande permet de lancer tous les composants (scheduler, executor, worker et webserver) dans le même processus
    # --worker-thread=2 permet au worker d’exécuter au maximum 2 tâches en même temps (même si il n'y a pas de tâches en parallèle)
    command: server standalone --worker-thread=2
    environment:
      # La limite mémoire pour la machine virtuelle (JVM) dans laquelle s'execute Java
      JAVA_TOOL_OPTIONS: -Xmx768m
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            # Adresse de conenxion à la base postgres interne de kestra, au format jdbc
            # url: pilote_Postgresql://nom_de_la_base_port_intern_du_conteneur/nom_de_la_base
            url: jdbc:postgresql://postgres:5432/kestra
            # l'emplacement du driver pour se conncter à postgres
            driverClassName: org.postgresql.Driver
            # Identifiants postgres du rôle kestra
            username: kestra
            password: ${KESTRA_DB_PASSWORD}
            # Pas nécessaire, déjà présent dans le .env monté grâce aux commandes set ... executées dans Kestra
            #SLACK_DB_PASSWORD: ${SLACK_DB_PASSWORD}
        # Configuration de Kestra, inscrite sur la base interne de Kestra
        kestra:
          # Configuration du serveur : identifiants de connexion
          server:
            basic-auth:
              username: ${KESTRA_ADMIN_EMAIL}
              password: ${KESTRA_ADMIN_PASSWORD}
          # Où sont stocker les meta données de Kestra : dans la base définie ci-dessus par la source postgres
          repository:
            type: postgres
          # Où sont stocker la file demessages internes de Kestra : dans la base définie ci-dessus par la source postgres
          queue:
            type: postgres
          # Le stockage interne de fichier de Kestra se fait quant à lui en en local, pas dans postgres
          storage:
            type: local
            # l'Emplacement local des fichiers interne, dans le système de fichier du conteneur
            local:
              base-path: /app/storage
          # Configuration pour les tâches
          tasks:
            # Dossier de travail temporaire de chaque tâche, vidé après l'execution des tâches
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          # Url du webserveur accessible depuis l'exterieur (hors du conteneur)
          url: http://localhost:8080/
    # Le port du conteneur à l'exterieur est le même qu'à l'intérieur : 8080
    ports:
      - "127.0.0.1:8080:8080"     # http://localhost:8080
    # Volumes nommées, qui survivent à la suppression du conteneur
    # Pour la structure on a toujours : les dossiers et volumes persistants sur mon poste : les dossiers montés dans le conteneur
    volumes:
      # Permet de conserver quelque part (dans kestra_storage de docker) le stockage interne de Kestra, définie ci-dessus
      - kestra_storage:/app/storage
      # Python + dépendances du projet (installés au 1er lancement) stockés dans /opt/uv du conteneur
      - kestra_uv:/opt/uv
      # le projet présent à la racine (.) est monté dans un dossier /projet12 à la racine du système de fichier du conteneur    
      - .:/projet12:ro             
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1536m

  # ---------------------------------------------------------------------------
  # Consommateurs temps réel : services toujours actifs, relancés par Docker s'ils s'arrêtent. 
  # Même image (docker/app/Dockerfile), commande différente. Logs : docker logs -f p12-chargement / docker logs -f p12-slack
  # ---------------------------------------------------------------------------
  chargement:
    # On ne fait qu'une clause build pour les deux conteneurs car il n'y a qu'une seule image à créer
    # Cette image (projet12-consumers) est crée une seule fois par la clause ci-dessous
    build:
      # Le contexte de l'image se trouve être la racine du projet
      context: .
      # A partir de ce contexte, il faut indiquer où se trouve le Dockerfile de l'image
      dockerfile: docker/consumers/Dockerfile
    # Si l'image est la même pour les deux conteneurs à savoir projet12-consumers
    image: projet12-consumers
    # Le conteneur est bien propre à chaque service, un pour le chargement et un pour slack
    container_name: p12-chargement
    # Tant que le service n'est pas lancé avec les autres, on le relance
    restart: unless-stopped
    # Commande pour lancere spécifiquement ce service
    command: ["python", "-m", "projet12.chargement"]
    environment:
      # Adresses vues DEPUIS le réseau Docker (et non depuis ta machine)
      # Le service postgres sert au chargement pour stocker les activités dans raw
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # Il utilise le rôle etl pour extraire (et charger) les informations dans raw
      ETL_PASSWORD: ${ETL_PASSWORD}
      # Il reçoit ses informations du service redpanda, avec lequel il a besoin de communiquer
      # C'est le port du service dans le réseau docker (projet12_default), pas depuis l'exterieur.
      KAFKA_BOOTSTRAP: redpanda:9092
    # postgres et redpanda doivent évidemment être lancé pour que le chargement puisse s'opérer
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    # La taille limite de RAM pour ce conteneur est faible
    mem_limit: 256m

  # Les commentaires ci-dessous sont quasiment les mêmes que pour le conteneur ci-dessus
  slack:
    # même image, construite par le service chargement/ à ne pas reconstruire une deuxième fois
    image: projet12-consumers
    # Pour éviter un code d'erreur, ne pas la chercher sur Docker Hub : elle est locale   
    pull_policy: never          
    container_name: p12-slack
    restart: unless-stopped
    command: ["python", "-m", "projet12.slack"]
    environment:
      # Le consommateur slack utilise postgres non pas pour écrire mais pour lire la vue raw.nom_salaries
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # Pour lire cette vue, il faut qu'il se connecte avec le rôle slack_notifier pour lire la vue
      SLACK_DB_PASSWORD: ${SLACK_DB_PASSWORD}
      # Il a aussi besoin de l'url du webhook pour afficher les messages en temps réel
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      # De la même manière que pour le chargement, il doit être connecté à redpanda pour recevoir les messages du topic
      KAFKA_BOOTSTRAP: redpanda:9092
    # A l'instar de chargement, les services redpanda et postgres doivent déjà être en execution
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    mem_limit: 256m

# Etant donné que ce ne sont pas des chemins déjà existants (comme les montages de dossier), les volumes docker doivent être crée
# Par conséquent, on déclare ici les volumes pour qu'ils soient crée avant d'être utilisés dans les services 
volumes:
  pgdata:
  redpanda_data:
  debezium_data:
  kestra_storage:
  kestra_uv:
