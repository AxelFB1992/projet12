# Contrôles des distances domicile-travail (data source dwh_geo = schéma geo).
# Une distance manquante rend la déclaration "non vérifiée" : la prime n'est pas versée, d'où un avertissement à traiter par les RH.

# Contrôles sur la seule table du schéma geo
checks for distances_domicile_travail:
  - row_count > 0:
      name: Des distances ont été calculées
  - duplicate_count(id_salarie) = 0:
      name: Une seule distance par salarié
  # La "methode" invalid_count se sert d'un d'un indice de validité pour faire son calcul. Celui-ci est affichée en dessous ("ROUTE_EXISTS")
  - invalid_count(statut) = 0:
      name: Itinéraire trouvé par Google pour chaque trajet
      valid values: [ROUTE_EXISTS]
      warn: when > 0
  - missing_count(distance_m) = 0:
      name: Distance renseignée
      warn: when > 0
  # On décidé qu'une distance n'a pas été calculé recemment quand son calcul date de plus de 90jours (90d)
  - freshness(calcule_le):
      name: Distances recalculées récemment (adresses à jour)
      warn: when > 90d
