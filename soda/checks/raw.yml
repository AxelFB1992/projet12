# Contrôles des données BRUTES (data source dwh_raw = schéma raw).
# Deux niveaux : "warn" = à surveiller, "fail" = le pipeline doit s'arrêter.

# ---------------------------------------------------------------------------
# Activités (source façon Strava : qualité non maîtrisée, on s'attend à
# quelques erreurs -> avertissement ; échec seulement si elles deviennent nombreuses)
# ---------------------------------------------------------------------------
checks for activites:
  # Volumétrie et fraîcheur : le flux temps réel est-il vivant ?
  - row_count > 0:
      name: Des activités ont été chargées
  - freshness(charge_le):
      name: Dernier chargement d'activité récent
      warn: when > 1d
      fail: when > 7d

  # Intégrité
  - duplicate_count(id_activite) = 0:
      name: Pas d'activité en double
  - missing_count(id_salarie) = 0:
      name: Chaque activité a un salarié
  - values in (id_salarie) must exist in salaries (id_salarie):
      name: Chaque activité concerne un salarié de la base issue du fichier RH

  # Cohérence des mesures : Ces mesures sont faites sur chacune des lignes, puis une agrégation est faite sur les résultats
  # Cette agrégation permet de savoir les résultats passent globalement le test ou pas
  # Pour savoir si une distance est valide ou pas, soda utilise les indices "valid" renseignés ci-dessous
  - invalid_percent(distance_m):
      name: Distances comprise entre 0 et 300 km (% d'activités hors bornes)
      valid min: 0
      valid max: 300000
      warn: when > 0
      fail: when > 1
  - dates_incoherentes:
      name: Fin après le début et durée de moins de 24 h (nb d'activités en erreur)
      dates_incoherentes query: |
        select count(*)
        from raw.activites
        where date_fin <= date_debut
           or date_fin - date_debut >= interval '24 hours'
      warn: when > 0
      fail: when > 50
  # C'est typiquement ici que l'on va se servir des seeds que l'on a chargé avec la commande dbt
  - vitesses_implausibles:
      name: Vitesse moyenne plausible pour le sport (nb d'activités en erreur)
      # Seuils par sport : seed dbt analytics.vitesses_max (dbt/seeds/vitesses_max.csv)
      # On fait un jointure avec la table des vitesses (dans analytics) pour les sports ayant une distance (Ex : Course à pied)
      # On retient les lignes qui ont une date de début postérieure à la date de fin (pour calculer la vitesse)
      # Et on divise la durée par la distance pour calculer la distance, en ne retenant que les lignes pour lesquels cette vitesse est au dessus du max
      vitesses_implausibles query: |
        select count(*)
        from raw.activites a
        join analytics.vitesses_max v using (type_activite)
        where a.distance_m > 0
          and a.date_fin > a.date_debut
          and a.distance_m / 1000.0
              / (extract(epoch from (a.date_fin - a.date_debut)) / 3600.0) > v.vitesse_max_kmh
      # Si il y a plus de 50 vitesses au dessus de la limite, on signe l'echec
      warn: when > 0
      fail: when > 50
  # Si une activité n'est pas recensé comme une activité "connue"
  - invalid_count(type_activite):
      name: Type d'activité connu
      valid values: [Badminton, Basketball, Boxe, Course à pied, Escalade, Football,
                     Judo, Marche, Natation, Randonnée, Rugby, Tennis, Tennis de table,
                     Voile, Vélo, Équitation]
      warn: when > 0

# ---------------------------------------------------------------------------
# Référentiel RH (fichier Excel) : une erreur ici fausse les avantages -> échec
# ---------------------------------------------------------------------------
checks for salaries:
  # Au moins un salarié dans la table salaries chargé à partir du fichier RH lors de l'ingestion
  - row_count > 0:
      name: Le fichier RH n'est pas vide
  - schema:
      name: Colonnes attendues du fichier RH
      fail:
        when required column missing: [id_salarie, date_embauche, salaire_brut,
                                       adresse, moyen_deplacement]
  - duplicate_count(id_salarie) = 0:
      name: Pas de salarié en double
  - missing_count(salaire_brut) = 0:
      name: Salaire renseigné
  - min(salaire_brut) > 0:
      name: Salaire positif
  - missing_count(adresse) = 0:
      name: Adresse renseignée (nécessaire au calcul de distance)
  - invalid_count(moyen_deplacement) = 0:
      name: Moyen de déplacement connu
      valid values: [Marche/running, Vélo/Trottinette/Autres,
                     Transports en commun, véhicule thermique/électrique]
  - invalid_count(type_contrat) = 0:
      name: Type de contrat connu
      valid values: [CDI, CDD]
  - embauches_futures = 0:
      name: Pas de date d'embauche dans le futur
      embauches_futures query: |
        select count(*) from raw.salaries where date_embauche > current_date

# ---------------------------------------------------------------------------
# Sports déclarés
# ---------------------------------------------------------------------------
# Cette table liste les sports par salaries (donc a autant de lignes que la table salaries)
checks for sports:
  - row_count same as salaries:
      name: Une ligne par salarié du fichier RH
  - duplicate_count(id_salarie) = 0:
      name: Pas de salarié en double
