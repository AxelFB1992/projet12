# Ce fichier sert à indiquer les tables sources pour les différents modèle de staging
# Il se contente de donner la liste des sources : chaque modèle viendra récuperer la bonne base du bon schéma dans son code
version: 2

# On commence par indiquer les 3 sources bruts (directement ingéré par Redpanda - chargement) dans la base de données dwh
sources:
  - name: raw
    description: Données brutes, chargées telles quelles par les scripts Python
    schema: raw
    tables:
      - name: salaries
        description: Fichier RH (ingestion)
        columns:
          - name: id_salarie
            data_tests: [unique, not_null]
      - name: sports
        description: Fichier sport déclaré (ingestion)
        columns:
          - name: id_salarie
            data_tests: [unique, not_null]
      - name: activites
        description: Activités sportives (Redpanda -> consommateur de chargement)
        columns:
          - name: id_activite
            data_tests: [unique, not_null]

# Puis on va chercher la table distances_domicile_travail du schémas geo, nécessaires aux transformations
  - name: geo
    description: Distances domicile-travail (API Google Routes)
    schema: geo
    tables:
      - name: distances_domicile_travail
        columns:
          - name: id_salarie
            data_tests: [unique, not_null]
