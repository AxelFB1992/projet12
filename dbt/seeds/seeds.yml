# Ce fichier structure les véritables fichiers de seeds pointé par la rubrique ci-dessous (seeds)
# Ici il n'y a qu'un fichier de seeds 
version: 2

seeds:
  # Le nom du seul fichier de seed qu'il y a actuellement : parametres.csv
  - name: parametres
    description: >
      Paramètres métier par défaut des avantages sportifs (une seule ligne).
      Modifiables ici, ou surchargés au lancement : dbt build --vars '{taux_prime: 0.03}'.
    config:
      # Le type de chacun des colonnes
      column_types:
        taux_prime: numeric
        seuil_marche_km: numeric
        seuil_velo_km: numeric
        nb_jours_bien_etre: integer
        nb_activites_min: integer
        jours_travailles_an: integer
        periode_jours: integer
    # La description de chaque colonne 
    columns:
      - name: taux_prime
        description: Part du salaire brut annuel versée en prime (0.05 = 5 %)
      - name: seuil_marche_km
        description: Distance domicile-bureau maximale pour la marche/course (km)
      - name: seuil_velo_km
        description: Distance domicile-bureau maximale pour le vélo/trottinette (km)
      - name: nb_jours_bien_etre
        description: Nombre de journées bien-être accordées
      - name: nb_activites_min
        description: Nombre minimal d'activités sur la période pour y avoir droit
      - name: jours_travailles_an
        description: Jours travaillés par an, pour valoriser une journée
      - name: periode_jours
        description: Période (en jours) sur laquelle on compte les activités

  #Il y a désormais un autre fichier de paramètres pour gérer les vitesses : vitesse_max.csv
  - name: vitesses_max
    description: >
      Vitesse moyenne maximale plausible par sport (marge large au-dessus des records).
      Au-delà, l'activité est jugée incohérente : exclue des avantages (dbt),
      signalée (Soda) et non annoncée sur Slack, qui lit aussi ce fichier.
    config:
      column_types:
        type_activite: text
        vitesse_max_kmh: numeric
    columns:
      - name: type_activite
        data_tests: [unique, not_null]
      - name: vitesse_max_kmh
        description: Vitesse moyenne maximale en km/h
